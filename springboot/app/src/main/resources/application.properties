server.port=${SERVER_PORT:8081}

# Database: values come from environment variables (ConfigMap / Secret)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service:3306/demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# CORS: real front-end origin(s), comma separated, injected by Kubernetes
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
