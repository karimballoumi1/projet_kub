apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tp-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: angular.tp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angular-service
                port:
                  number: 80
    - host: api.tp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spring-service
                port:
                  number: 8081
